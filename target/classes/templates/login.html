<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto mt-16 p-6 bg-white rounded shadow">
    <h1 class="text-2xl mb-4">Login</h1>
    <form th:action="@{/login}" method="post">
        <div class="mb-2">
            <label class="block">Username</label>
            <input type="text" name="username" class="w-full border px-2 py-1" required />
        </div>
        <div class="mb-4">
            <label class="block">Password</label>
            <input type="password" name="password" class="w-full border px-2 py-1" required />
        </div>
        <div>
            <button class="bg-blue-600 text-white px-4 py-2 rounded">Login</button>
            <a href="/register" class="ml-4 text-sm text-gray-600">Register</a>
        </div>
    </form>
</div>
</body>
</html>
